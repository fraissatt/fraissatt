  <path d="M194 53 H206 V55 H196 Z" fill="#1a4fa0"/>
  <path d="M203 43 Q209 41 212 46 L211 49 Q206 47 203 49 Z" fill="#0b0b0d"/>
  <!-- front wing -->
  <rect x="322" y="92" width="64" height="5" rx="2" fill="#0b0b0d"/>
  <rect x="378" y="83" width="5" height="16" rx="2" fill="#d40000"/>
  <!-- wheels -->
  <circle cx="96" cy="80" r="25" fill="#08080a"/>
  <circle cx="96" cy="80" r="12" fill="#8d8d95"/>
  <circle cx="96" cy="80" r="4" fill="#08080a"/>
  <circle cx="306" cy="84" r="21" fill="#08080a"/>
  <circle cx="306" cy="84" r="10" fill="#8d8d95"/>
  <circle cx="306" cy="84" r="3.5" fill="#08080a"/>
