  <path d="M262 60 L292 68 L296 73 L262 66 Z" fill="#d40000"/>
  <!-- driver helmet: yellow with green and blue bands (no face, no marks) -->
  <circle cx="200" cy="46" r="8" fill="#ffd600"/>
