  <path d="M56 78 L68 62 L112 56 L146 40 L164 30 L182 30 L190 46 L220 56 L244 54 L292 68 L338 80 L344 87 L318 92 L150 96 L60 94 Z" fill="#f4f4f4"/>
  <path d="M146 40 L164 30 L182 30 L188 44 L160 48 Z" fill="#d0d0d4"/>
  <!-- red lower body and sidepod -->
  <path d="M60 94 L56 78 L68 74 L150 80 L240 74 L300 84 L338 86 L344 87 L318 92 L150 96 Z" fill="#d40000"/>
  <path d="M136 66 L224 62 L242 76 L228 88 L144 90 Z" fill="#d40000"/>
  <path d="M146 74 L224 70 L232 77 L148 81 Z" fill="#0b0b0d" opacity=".5"/>
