<svg xmlns="http://www.w3.org/2000/svg" width="400" height="130" viewBox="0 0 400 130" role="img" aria-label="Stylized red and white Formula 1 car from the early 1990s, side view">
  <rect width="400" height="130" rx="8" fill="#1e1e22"/>
  <rect x="12" y="104" width="376" height="3" rx="1.5" fill="#4a4a52"/>
  <!-- rear wing -->
  <rect x="22" y="34" width="7" height="42" rx="2" fill="#d40000"/>
  <rect x="24" y="36" width="58" height="7" rx="3" fill="#0b0b0d"/>
  <rect x="28" y="49" width="52" height="6" rx="3" fill="#0b0b0d"/>
  <path d="M66 55 L72 68 L84 68 L80 55 Z" fill="#0b0b0d"/>
